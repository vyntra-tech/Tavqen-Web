services:
  tavqen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tavqen-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - tavqen-uploads:/app/public/uploads

volumes:
  tavqen-uploads: